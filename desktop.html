    <!-- ================================================
         CUSTOM EVENTS
         ================================================ -->

    <script>

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                document
                    .querySelector('.custom-icon')
                    ?.addEventListener(
                        'click',
                        event => {

                            const object =
                                event.currentTarget
                                    ._interactiveObject;

                            if (!object) {
                                return;
                            }

                            console.log(
                                '🎯 Custom icon clicked!',
                                object
                            );

                            const status =
                                document.getElementById('status');

                            if (status) {
                                status.textContent =
                                    '✨ Custom action triggered!';
                            }

                        }
                    );


                document.addEventListener(
                    'object-rightclick',
                    event => {

                        const {
                            object
                        } = event.detail;

                        console.log(
                            '🔄 Right-click on:',
                            object.id
                        );

                        const status =
                            document.getElementById('status');

                        if (status) {

                            status.textContent =
                                `🔄 Right-clicked: ${object.id}`;

                        }

                    }
                );


                document.addEventListener(
                    'object-state-change',
                    event => {

                        const {
                            object,
                            oldState,
                            newState
                        } = event.detail;

                        console.log(
                            `📊 ${object.id}: ${oldState} → ${newState}`
                        );

                    }
                );


                document.addEventListener(
                    'page-images-ready',
                    event => {

                        const objects =
                            event.detail.objects;

                        console.log(
                            `🎉 Page Images ready! ${objects.length} objects initialized`
                        );

                        objects.forEach(
                            object => {

                                console.log(
                                    `  - ${object.id}: ${object.action}`
                                );

                            }
                        );

                    }
                );


                document.addEventListener(
                    'window-content-loaded',
                    event => {

                        const status =
                            document.getElementById('status');

                        if (status) {

                            status.textContent =
                                `📄 Loaded: ${event.detail.id}`;

                        }

                    }
                );

            }
        );


        // ============================================
        // PROGRAMMATIC ICON CREATION
        // ============================================

        function addDesktopIcon(config) {

            const container =
                document.querySelector(
                    '.desktop-icons'
                );

            if (!container) {
                return null;
            }

            const div =
                document.createElement('div');

            div.className =
                'desktop-icon';

            Object.keys(config).forEach(
                key => {

                    div.dataset[key] =
                        config[key];

                }
            );

            const img =
                document.createElement('img');

            img.src =
                config.src ||
                config['data-src'] ||
                '';

            div.appendChild(img);

            const label =
                document.createElement('span');

            label.className =
                'icon-label';

            label.textContent =
                config.label ||
                config.id ||
                'Icon';

            div.appendChild(label);

            container.appendChild(div);

            return div;
        }

    </script>


    <!-- ================================================
         GALLERY PRELOAD
         ================================================ -->

    <script>

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                const gallerySystem =
                    window.getGallerySystem?.();

                if (!gallerySystem) {
                    return;
                }

                gallerySystem
                    .loadManifest()
                    .then(
                        () => {

                            console.log(
                                '📚 Gallery manifest pre-loaded'
                            );

                        }
                    );

            }
        );

    </script>
