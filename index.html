<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My mind</title>
    <link rel="stylesheet" href="Things.css">
    <link rel="icon" type="image/webp" href="images/desktop/favicon.webp">
    <style>

        /* ============================================
           RESET
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }


        /* ============================================
           PHONE BOOT LAYER
           ============================================ */

        #phone-boot-layer {
            position: fixed;
            inset: 0;

            z-index: 100;

            pointer-events: none;
        }

        #phone-boot-layer > .desktop-icon {
            pointer-events: auto;
        }


        /* ============================================
           PHONE
           ============================================ */

        #phone-boot-layer .desktop-icon {
            position: fixed;

            left: 20%;
            top: 85%;

            width: 400px;

            transform:
                translate(-50%, -50%);

            pointer-events: auto;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;
        }

        #phone-boot-layer .desktop-icon img {
            display: block;

            width: 100%;
            height: auto;

            pointer-events: none;
        }


        /* ============================================
           DESKTOP CONTENT
           ============================================ */

        #desktop-root {
            position: fixed;
            inset: 0;

            z-index: 1;
        }


        /* ============================================
           BOOT STATE
           ============================================ */

        body.phone-booting #desktop-root {
            display: none;
        }

        body.phone-ready #phone-boot-layer {
            display: none;
        }

        body.phone-ready #desktop-root {
            display: block;
        }

    </style>

</head>


<body class="phone-booting">


    <!-- ============================================
         PHONE BOOT
         ============================================ -->

    <div id="phone-boot-layer">

        <div
            class="desktop-icon"
            data-id="phone"
            data-src="/images/desktop/dialing.webp"
            data-width="400">

            <img
                src="/images/desktop/dialing.webp"
                alt="Phone">

        </div>

    </div>


    <!-- ============================================
         DESKTOP
         
         Empty until phone-system.js loads
         desktop.html.
         ============================================ -->

    <div id="desktop-root"></div>


    <!-- ============================================
         PHONE SYSTEM
         
         This is deliberately the first system.
         It decides when the desktop boots.
         ============================================ -->

    <script src="phone-system.js"></script>


</body>

</html>
