<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            color: white;
            font-family: monospace;
            background: transparent;
            position: relative;
            min-height: 100%;
        }

        /* Content wrapper with padding for the icon */
        .content-wrapper {
            padding: 20px;
            padding-right: 90px; /* Space for the corner icon */
            position: relative;
            min-height: 100%;
        }

        h1 {
            color: #8be9fd;
            margin-top: 0;
            font-size: 1.8em;
        }

        p {
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .highlight {
            color: #50fa7b;
            font-weight: bold;
        }

        .emoji {
            font-size: 1.2em;
        }

        /* Decorative divider */
        .divider {
            border: none;
            height: 2px;
            background: linear-gradient(to right, rgba(139, 233, 253, 0.5), transparent);
            margin: 20px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .content-wrapper {
                padding: 15px;
                padding-right: 70px;
            }
            .corner-icon {
                width: 48px;
                height: 48px;
                top: 5px;
                right: 5px;
            }
            h1 {
                font-size: 1.4em;
            }
            p {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>What the fuck do i put here</h1>
    </div>
</body>
</html>
